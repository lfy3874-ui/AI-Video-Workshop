name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Extract source ZIP
        run: |
          mkdir extracted
          for f in *.zip; do
            if [ -f "$f" ]; then unzip -oq "$f" -d extracted; fi
          done
          PROJECT_DIR=$(find extracted -name settings.gradle.kts -print -quit | sed 's|/settings.gradle.kts$||')
          if [ -z "$PROJECT_DIR" ]; then echo "找不到安卓项目"; exit 1; fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: gradle --no-daemon -p "$PROJECT_DIR" :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: AI-Video-Workshop-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
